name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          NOTES_FILE="docs/release-notes-${VERSION}.md"
          test "$GITHUB_REF_NAME" = "v${PACKAGE_VERSION}"
          test "$LOCK_VERSION" = "$PACKAGE_VERSION"
          test "$LOCK_ROOT_VERSION" = "$PACKAGE_VERSION"
          test -f "$NOTES_FILE"
          node - "$NOTES_FILE" <<'NODE'
          const fs = require('fs')

          const file = process.argv[2]
          const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/)
          const firstContent = lines.find((line) => line.trim())?.trim()
          const updates = lines.findIndex((line) => line.trim() === '## 更新日志')
          const compatibility = lines.findIndex((line) => line.trim() === '## 兼容说明')
          const verification = lines.findIndex((line) => line.trim() === '## 验证情况')

          if (firstContent !== '## 更新日志' || updates < 0 || compatibility <= updates || verification <= compatibility) {
            throw new Error('发行说明必须依次包含更新日志、兼容说明和验证情况')
          }

          const summaries = lines.slice(updates + 1, compatibility).filter((line) => line.trim())
          const compatibilityBody = lines.slice(compatibility + 1, verification).some((line) => line.trim())
          const verificationBody = lines.slice(verification + 1).some((line) => line.trim())
          if (summaries.length !== 4 || summaries.some((line) => !/^-\s+\S/.test(line.trim()) || line.length > 72)) {
            throw new Error('更新日志必须恰好包含四条不超过 72 字符的摘要')
          }
          if (!compatibilityBody || !verificationBody) {
            throw new Error('兼容说明和验证情况不能为空')
          }
          NODE

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: dist-mac
          - os: windows-latest
            script: build:win
            artifact: dist-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # package.json 里的 repository 字段会让 electron-builder 在 CI(CI=true)下自动推断
      # GitHub publish 目标并尝试联网发布，没传 --publish 也一样，缺 GH_TOKEN 就直接报错退出。
      # 这里显式关掉自动发布：只在本 job 里产出本地安装包，真正发布交给下面单独的 publish job，
      # 避免两个 matrix job 各自抢着建 release 造成竞态。
      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # 两个平台各自只上传构建产物为 artifact，不在 matrix 里直接 --publish：
  # 并行的两个 job 同时 publish 会各自建一个 draft release（找不到彼此刚建的那个），
  # 导致同一个 tag 拆成两个不完整的 draft。改为等两边都构建完，
  # 由这个单独 job 统一创建一个 release 并把所有产物传上去。
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 发行说明是发布协议的必需输入；缺失时直接阻止发布不完整的 Release。
      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="docs/release-notes-${VERSION}.md"
          test -f "$NOTES_FILE"
          cp "$NOTES_FILE" release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f -name '*-arm64.dmg' | grep -q .
          find release-assets -maxdepth 1 -type f -name '*.dmg' ! -name '*-arm64.dmg' | grep -q .
          find release-assets -maxdepth 1 -type f -name '*-Setup.exe' | grep -q .
          find release-assets -maxdepth 1 -type f -name '*-portable.exe' | grep -q .
          test -f release-assets/latest-mac.yml
          test -f release-assets/latest.yml
          find release-assets -maxdepth 1 -type f -name '*-arm64.dmg.blockmap' | grep -q .
          find release-assets -maxdepth 1 -type f -name '*.dmg.blockmap' ! -name '*-arm64.dmg.blockmap' | grep -q .
          find release-assets -maxdepth 1 -type f -name '*-Setup.exe.blockmap' | grep -q .

      - uses: softprops/action-gh-release@v2
        with:
          name: Simple Music ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          files: release-assets/**
