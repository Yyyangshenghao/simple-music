name: Release

# 手动触发发版：先校验、三平台测试与正式打包，全部成功后最后一步才创建 tag 与 Release。
# 任何一步失败都不会留下 tag，修复后用同一个版本号重跑即可，版本号不会被失败的构建占掉。
#   正式版：gh workflow run release.yml --ref master -f channel=stable
#   预发版：gh workflow run release.yml --ref dev/X.Y.Z -f channel=beta（beta 号自动递增）
#   只打包不发布：再加 -f dry_run=true
# 不再监听 tag 推送：手动推送的 v* tag 不会触发任何发布。
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道
        type: choice
        options: [stable, beta]
        default: stable
      dry_run:
        description: 只打包和检查，不创建 tag 与 Release
        type: boolean
        default: false

permissions:
  contents: read

# 同一时间只跑一个发版，排队等待而不是取消，避免两次发版抢同一个版本号。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12

      - name: Resolve version
        id: version
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$CHANNEL" == stable ]]; then
            # 正式版只能从 master 发，版本取 package.json。
            [[ "$GITHUB_REF" == refs/heads/master ]] || { echo "::error::正式版只能从 master 发布，当前为 $GITHUB_REF_NAME"; exit 1; }
            VERSION="$PACKAGE_VERSION"
            PRERELEASE=false
          else
            # 预发版从 dev/X.Y.Z 发，目标版本取分支名，beta 号在远端已有的基础上加一。
            [[ "$GITHUB_REF_NAME" =~ ^dev/([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::预发版只能从 dev/X.Y.Z 发布，当前为 $GITHUB_REF_NAME"; exit 1; }
            BASE="${BASH_REMATCH[1]}"
            LAST="$(git ls-remote --tags origin | sed -nE "s#.*refs/tags/v${BASE//./\\.}-beta\.([0-9]+)\$#\1#p" | sort -n | tail -1)"
            VERSION="${BASE}-beta.$(( ${LAST:-0} + 1 ))"
            PRERELEASE=true
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::v${VERSION} 已存在，不能覆盖已发布的版本；正式版请先升级 package.json 版本"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "### 本次发布 v${VERSION}（${CHANNEL}，提交 ${GITHUB_SHA::7}）" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release metadata
        run: node scripts/release/check-release.mjs "${{ steps.version.outputs.version }}"

  package:
    needs: prepare
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sign: true
      retention-days: 7
    secrets: inherit

  publish:
    needs: [prepare, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare release notes
        shell: bash
        run: |
          if [[ "${{ needs.prepare.outputs.prerelease }}" == true ]]; then
            {
              echo "## 预发版"
              echo
              echo "仅供维护者验收真实安装包，不会推送给自动更新。来源分支 \`${GITHUB_REF_NAME}\`，提交 \`${GITHUB_SHA::7}\`。"
              echo
              echo "装上后与正式版共用应用数据；正式版 v${VERSION%%-*} 发布后可在应用内直接更新。"
            } > release-notes.md
          else
            cp "docs/release-notes-${VERSION}.md" release-notes.md
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # 先建草稿并传完所有文件，再一次性公开：草稿不会创建 tag，中途失败也不会留下 tag 或缺文件的公开 Release。
      - name: Create draft release
        shell: bash
        run: |
          # 重跑时清掉上次失败遗留的同名草稿（只删草稿，已公开的 Release 不会被动到）。
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$TAG" --yes
          fi
          FLAGS=()
          [[ "${{ needs.prepare.outputs.prerelease }}" == true ]] && FLAGS+=(--prerelease)
          gh release create "$TAG" release-assets/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Simple Music $TAG" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"

      - name: Publish release
        shell: bash
        run: |
          if [[ "${{ needs.prepare.outputs.prerelease }}" == true ]]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          echo "已发布 $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
